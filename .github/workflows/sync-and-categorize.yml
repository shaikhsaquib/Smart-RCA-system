name: Sync and Categorize Supplier Tickets

# Free scheduling via GitHub Actions instead of a paid cron/host.
# Runs the batch sync (FSD 4.1) followed by categorization (FSD 4.3) on a schedule,
# and can also be triggered manually from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

jobs:
  sync-and-categorize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync tickets from Jira
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DEFAULT_JQL: ${{ secrets.JIRA_DEFAULT_JQL }}
        run: npm run sync-tickets

      - name: Categorize new tickets
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: npm run categorize-tickets
